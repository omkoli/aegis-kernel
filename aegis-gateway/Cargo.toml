[package]
name = "aegis-gateway"
version = "0.1.0"
edition = "2021"
description = "Transparent MCP proxy engine for the Aegis kernel"

[dependencies]
aegis-mcp = { path = "../aegis-mcp" }
aegis-handle = { path = "../aegis-handle" }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1"
