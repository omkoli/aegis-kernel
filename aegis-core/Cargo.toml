[package]
name = "aegis-core"
version = "0.1.0"
edition = "2021"
description = "Core types and error model for the Aegis kernel"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[dev-dependencies]
serde_json = "1"
