[package]
name = "aegis-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP protocol parser and message types for the Aegis kernel"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync"] }
bytes = "1"
pin-project-lite = "0.2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
