[package]
name = "aegis-audit"
version = "0.1.0"
edition = "2021"
description = "Append-only audit log with ring buffer, query API, and JSONL export"

[dependencies]
aegis-core = { path = "../aegis-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serde_json = "1"
